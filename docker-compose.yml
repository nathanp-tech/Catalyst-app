version: '3.8'

services:
  db:
    image: postgres:15
    container_name: catalyst_db
    environment:
      - POSTGRES_DB=catalyst_db
      - POSTGRES_USER=catalyst_user
      - POSTGRES_PASSWORD=catalyst_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
